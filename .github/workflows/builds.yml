# Gera as builds de Windows, Linux, Android e Web a cada push para "main" (ou manualmente):
#  - os ficheiros ficam no separador "Actions" do GitHub, em "Artifacts";
#  - a versão Web é publicada no GitHub Pages (ativar em Settings → Pages → Source: "GitHub Actions");
#  - ao criar uma tag "v*" (ex.: git tag v1.0.0 && git push --tags) cria também uma Release com
#    os ficheiros para descarregar.
name: Builds

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Godot e templates de exportação
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $dest
          unzip -qj Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d $dest

      - name: Configurar Android (SDK do runner + chave de debug)
        run: |
          keytool -genkeypair -v -keystore $GITHUB_WORKSPACE/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          minor=$(echo $GODOT_VERSION | cut -d. -f1,2)
          for f in editor_settings-4.tres editor_settings-$minor.tres; do
          cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          done

      - name: Importar recursos
        run: godot --headless --import

      - name: Exportar
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p builds/windows builds/linux builds/android builds/web
          godot --headless --export-release "Windows" builds/windows/ArcadeClassico.exe
          godot --headless --export-release "Linux" builds/linux/ArcadeClassico.x86_64
          godot --headless --export-debug "Android" builds/android/ArcadeClassico.apk
          godot --headless --export-release "Web" builds/web/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: ArcadeClassico-windows
          path: builds/windows
      - uses: actions/upload-artifact@v4
        with:
          name: ArcadeClassico-linux
          path: builds/linux
      - uses: actions/upload-artifact@v4
        with:
          name: ArcadeClassico-android
          path: builds/android

      - name: Preparar a versão Web para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: builds/web

      - name: Criar a Release (só nas tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd builds
          (cd windows && zip -qr ../ArcadeClassico-windows.zip .)
          (cd linux && zip -qr ../ArcadeClassico-linux.zip .)
          cp android/ArcadeClassico.apk ArcadeClassico-android.apk
          (cd web && zip -qr ../ArcadeClassico-web.zip .)
          gh release create "$GITHUB_REF_NAME" --title "Arcade Clássico $GITHUB_REF_NAME" --generate-notes \
            ArcadeClassico-windows.zip ArcadeClassico-linux.zip ArcadeClassico-android.apk ArcadeClassico-web.zip
        env:
          GH_TOKEN: ${{ github.token }}

  pages:
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

permissions:
  contents: write
  pages: write
  id-token: write
